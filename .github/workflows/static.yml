# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Reviews Planner once per day and publishes any roadmap changes
  schedule:
    - cron: "0 11 * * *"

  # Allows Power Automate to refresh the public page when Teams/Planner changes
  repository_dispatch:
    types: [planner_changed]

# Sets permissions of the GITHUB_TOKEN to publish the static site to gh-pages
permissions:
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export Planner roadmap snapshot
        id: export-planner
        continue-on-error: true
        timeout-minutes: 2
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          PLANNER_PLAN_ID: ${{ secrets.PLANNER_PLAN_ID }}
        run: node .github/scripts/export-planner-roadmap.js
      - name: Validate Planner roadmap snapshot
        run: |
          node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("planner-roadmap.json","utf8")); const tasks=(data.roadmap||[]).reduce((total,lane)=>total+(lane.tasks||[]).length,0); if (!tasks) throw new Error("planner-roadmap.json does not contain tasks"); console.log("Planner snapshot generatedAt=" + (data.generatedAt || "committed snapshot") + " tasks=" + tasks);'
      - name: Report Planner export fallback
        if: steps.export-planner.outcome == 'failure'
        run: echo "Planner export failed; publishing committed planner-roadmap.json snapshot."
      - name: Commit Planner snapshot to main
        if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planner-roadmap.json
          if git diff --cached --quiet; then
            echo "Planner snapshot has no changes to commit."
          else
            git commit -m "chore: refresh planner roadmap [skip ci]"
            git push origin HEAD:main
          fi
      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp index.html gantt.html styles.css gantt.css script.js gantt.js planner-roadmap.json public/
      - name: Publish static site to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
